name: LegendaryRais
version: 3.7.1
main: id.raisnet.legendaryrais.LegendaryRais
loadbefore: [Geyser-Spigot]\napi-version: '26.1.2'
author: RaisNet
softdepend: [floodgate]
description: LegendaryRais v3.7.1 Native-Stable Self-Deploy - reliable damage floors, no Java follower overlay, dual Bedrock mapping, auto-deployed Geyser assets, HD native armor.
commands:
  risgive:
    description: Give LegendaryRais gacha weapons or armor sets.
    usage: /risgive <player> <id> [amount]
    permission: legendaryrais.give
  rislegend:
    description: Open the full LegendaryRais weapon and armor GUI.
    usage: /rislegend
    permission: legendaryrais.legend
  risdiag:
    description: Diagnose Geyser custom mappings and Bedrock resource pack deployment.
    usage: /risdiag
    permission: legendaryrais.diag
  rishelmet:
    description: Toggle legendary helmet visor open/closed.
    usage: /rishelmet <open|closed|toggle|status>
    permission: legendaryrais.helmet
  risrepair:
    description: Refresh legacy LegendaryRais items to current resource assets.
    usage: /risrepair
    permission: legendaryrais.repair
  risperf:
    description: Choose LegendaryRais client FX performance mode.
    usage: /risperf <auto|low|balanced|cinematic|status>
    permission: legendaryrais.performance
  riswp:
    description: Open LegendaryRais weapon arsenal.
    usage: /riswp
    permission: legendaryrais.admin
permissions:
  legendaryrais.diag:
    description: Allows LegendaryRais deployment diagnostics.
    default: op
  legendaryrais.helmet:
    description: Allows toggling the legendary helmet visor.
    default: true
  legendaryrais.repair:
    description: Allows repairing personal LegendaryRais items.
    default: true
  legendaryrais.performance:
    description: Allows player to choose personal LegendaryRais FX quality.
    default: true
  legendaryrais.give:
    description: Allows console/admin gacha rewards via /risgive.
    default: op
  legendaryrais.admin:
    description: Full LegendaryRais administrator access.
    default: op
    children:
      legendaryrais.legend: true
      legendaryrais.give: true
  legendaryrais.legend:
    description: Open /rislegend full arsenal GUI.
    default: op

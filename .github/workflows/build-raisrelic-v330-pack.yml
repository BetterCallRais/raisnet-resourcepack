name: Build RaisRelic v3.3 Ascendant Forge Java Pack

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/build_raisrelic_v330.py'
      - '.github/workflows/build-raisrelic-v330-pack.yml'

permissions:
  contents: write

jobs:
  build-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build Ascendant Forge pack
        run: python .github/scripts/build_raisrelic_v330.py

      - name: Validate pack
        shell: bash
        run: |
          set -euo pipefail
          unzip -t RaisNet-RaisRelic-LegendaryWeapons-Java-26.1-v3.3.0.zip >/dev/null
          ACTUAL=$(sha1sum RaisNet-RaisRelic-LegendaryWeapons-Java-26.1-v3.3.0.zip | awk '{print $1}')
          EXPECTED=$(tr -d '\r\n ' < RaisNet-RaisRelic-LegendaryWeapons-Java-26.1-v3.3.0.sha1)
          test "$ACTUAL" = "$EXPECTED"
          echo "SHA1=$ACTUAL"
          echo "SIZE=$(stat -c%s RaisNet-RaisRelic-LegendaryWeapons-Java-26.1-v3.3.0.zip)"

      - name: Commit pack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RaisNet Pack Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add RaisNet-RaisRelic-LegendaryWeapons-Java-26.1-v3.3.0.zip RaisNet-RaisRelic-LegendaryWeapons-Java-26.1-v3.3.0.sha1
          if ! git diff --cached --quiet; then
            git commit -m 'Generate RaisRelic v3.3 Ascendant Forge Java pack'
            git push
          fi

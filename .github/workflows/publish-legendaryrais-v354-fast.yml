name: Publish LegendaryRais v3.5.4 Fast
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-legendaryrais-v354-fast.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
      - name: Reconstruct and compile
        run: |
          set -euo pipefail
          rm -rf .build/v354-fast .build/v354-fast.zip
          cat .build/v300x-00.b64 .build/v300x-01.b64 .build/v300x-02.b64 .build/v300x-03.b64 .build/v300x-04.b64 .build/v300x-05.b64 | tr -d '\n\r ' | base64 -d > .build/v354-fast.zip
          mkdir -p .build/v354-fast
          unzip -q .build/v354-fast.zip -d .build/v354-fast
          cp .build/extracted-v354/LegendaryRais.java .build/v354-fast/src/main/java/id/raisnet/legendaryrais/LegendaryRais.java
          cp .build/extracted-v354/ArsenalExpansion.java .build/v354-fast/src/main/java/id/raisnet/legendaryrais/ArsenalExpansion.java
          cp .build/extracted-v354/plugin.yml .build/v354-fast/src/main/resources/plugin.yml
          cp .build/extracted-v354/pom.xml .build/v354-fast/pom.xml
          cd .build/v354-fast
          mvn -B -U clean package
          cp target/legendaryrais-3.5.4.jar ../../LegendaryRais-3.5.4-VISUAL-INTEGRITY-PAPER-26.1.2.jar
          sha256sum ../../LegendaryRais-3.5.4-VISUAL-INTEGRITY-PAPER-26.1.2.jar > ../../LegendaryRais-3.5.4-VISUAL-INTEGRITY-PAPER-26.1.2.sha256
      - name: Verify
        run: |
          unzip -t LegendaryRais-3.5.4-VISUAL-INTEGRITY-PAPER-26.1.2.jar
          unzip -p LegendaryRais-3.5.4-VISUAL-INTEGRITY-PAPER-26.1.2.jar plugin.yml | grep -q "version: 3.5.4"
          jar tf LegendaryRais-3.5.4-VISUAL-INTEGRITY-PAPER-26.1.2.jar | grep -q 'ArsenalExpansion.class'
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LegendaryRais-3.5.4-VISUAL-INTEGRITY-PAPER-26.1.2.jar LegendaryRais-3.5.4-VISUAL-INTEGRITY-PAPER-26.1.2.sha256
          git commit -m "Publish LegendaryRais v3.5.4 Visual Integrity plugin" || exit 0
          git pull --rebase origin main
          git push

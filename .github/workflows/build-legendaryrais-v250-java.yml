name: Build LegendaryRais Java Pack v2.5.0 LIVE AURA

on:
  push:
    branches: [main]
    paths:
      - ".build/build_v220.py"
      - ".build/build_v240.py"
      - ".build/build_v250_java.py"
      - ".build/trigger-v250-java.txt"
      - ".github/workflows/build-legendaryrais-v250-java.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate Java LIVE AURA pack
        run: python3 .build/build_v250_java.py
      - name: Publish Java pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LegendaryRais-Java-26plus-v2.5.0-LIVE-AURA.zip LegendaryRais-Java-26plus-v2.5.0-LIVE-AURA.sha1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish LegendaryRais v2.5 Java LIVE AURA pack"
          git pull --rebase origin main
          git push

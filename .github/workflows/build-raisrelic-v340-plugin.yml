name: Build RaisRelic v3.4 Sovereign Arsenal Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - '.build/raisrelic-v340/**'
      - '.github/workflows/build-raisrelic-v340-plugin.yml'

permissions:
  contents: write

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
          cache-dependency-path: .build/raisrelic-v340/pom.xml
      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/raisrelic-v340/src/main/java/id/raisnet/raisrelic .build/raisrelic-v340/src/main/resources
          gzip -dc .build/raisrelic-v340/RaisRelicPlugin.java.gz > .build/raisrelic-v340/src/main/java/id/raisnet/raisrelic/RaisRelicPlugin.java
          cp .build/raisrelic-v340/plugin.yml .build/raisrelic-v340/src/main/resources/plugin.yml
          cp .build/raisrelic-v340/config.yml .build/raisrelic-v340/src/main/resources/config.yml
          grep -q 'class RaisRelicPlugin' .build/raisrelic-v340/src/main/java/id/raisnet/raisrelic/RaisRelicPlugin.java
          grep -q 'Sovereign Arsenal' .build/raisrelic-v340/src/main/java/id/raisnet/raisrelic/RaisRelicPlugin.java
          grep -q 'VANTA_REAVER' .build/raisrelic-v340/src/main/java/id/raisnet/raisrelic/RaisRelicPlugin.java
      - name: Compile against Spigot API 26.1.2
        run: mvn -B -f .build/raisrelic-v340/pom.xml clean package
      - name: Validate JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR=.build/raisrelic-v340/target/RaisRelic-3.4.0-Paper-26.1.2.jar
          test -s "$JAR"
          jar tf "$JAR" | grep -q 'id/raisnet/raisrelic/RaisRelicPlugin.class'
          unzip -p "$JAR" plugin.yml | grep -q "version: '3.4.0'"
          unzip -p "$JAR" plugin.yml | grep -q "api-version: '26.1'"
          cp "$JAR" RaisRelic-3.4.0-Paper-26.1.2.jar
          sha256sum RaisRelic-3.4.0-Paper-26.1.2.jar | awk '{print $1}' > RaisRelic-3.4.0-Paper-26.1.2.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaisRelic-3.4.0-Paper-26.1.2
          path: |
            RaisRelic-3.4.0-Paper-26.1.2.jar
            RaisRelic-3.4.0-Paper-26.1.2.sha256
      - name: Commit plugin
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RaisNet Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add RaisRelic-3.4.0-Paper-26.1.2.jar RaisRelic-3.4.0-Paper-26.1.2.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'Build RaisRelic v3.4 Sovereign Arsenal plugin'
            git push
          fi

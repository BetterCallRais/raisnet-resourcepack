name: Build LegendaryRais v2.1.2 FIX

on:
  push:
    branches: [main]
    paths:
      - ".build/build_v2112.py"
      - ".build/trigger-v2112.txt"
      - ".github/workflows/build-legendaryrais-v2.1.2.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate resource pack
        run: python3 .build/build_v2112.py
      - name: Commit generated pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LegendaryRais-Java-26plus-v2.1.2-FIX.zip LegendaryRais-Java-26plus-v2.1.2-FIX.sha1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish valid LegendaryRais v2.1.2 FIX pack"
          git push

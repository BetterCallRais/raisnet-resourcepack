name: Build LegendaryRais v2.1.2 FIX

on:
  push:
    branches:
      - main
    paths:
      - ".build/trigger-v2112.txt"
      - ".build/build_v2112.py"
      - ".github/workflows/build-legendaryrais-v2.1.2.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate base pack
        run: unzip -t LegendaryRais-Java-26plus-v2.1.zip
      - name: Build fixed pack
        run: python3 .build/build_v2112.py
      - name: Commit pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LegendaryRais-Java-26plus-v2.1.2-FIX.zip LegendaryRais-Java-26plus-v2.1.2-FIX.sha1
          git commit -m "Publish LegendaryRais v2.1.2 FIX resource pack"
          git push

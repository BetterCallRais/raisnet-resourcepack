name: Build LegendaryRais Bedrock Pack v3.5.2 Reforged Hotfix

on:
  push:
    branches: [main]
    paths:
      - ".build/build_v352_bedrock.py"
      - ".build/trigger-v352-bedrock.txt"
      - ".github/workflows/build-legendaryrais-v352-bedrock.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Build Bedrock pack + Geyser mappings
        run: python .build/build_v352_bedrock.py
      - name: Verify
        run: |
          unzip -t LegendaryRais-Bedrock-v3.5.2-REFORGED-HOTFIX.mcpack
          test -s LegendaryRais-Bedrock-v3.5.2-REFORGED-HOTFIX.sha1
          python -m json.tool LegendaryRais-Geyser-v3.5.2-mappings.json >/dev/null
          unzip -l LegendaryRais-Bedrock-v3.5.2-REFORGED-HOTFIX.mcpack | grep -q 'stormpiercer_recurve_bow.geo.json'
          unzip -l LegendaryRais-Bedrock-v3.5.2-REFORGED-HOTFIX.mcpack | grep -q 'soul_tide_katana.geo.json'
          unzip -l LegendaryRais-Bedrock-v3.5.2-REFORGED-HOTFIX.mcpack | grep -q 'abyss_leviathan_trident.geo.json'
      - uses: actions/upload-artifact@v4
        with:
          name: LegendaryRais-Bedrock-v3.5.2-REFORGED-HOTFIX
          path: |
            LegendaryRais-Bedrock-v3.5.2-REFORGED-HOTFIX.mcpack
            LegendaryRais-Bedrock-v3.5.2-REFORGED-HOTFIX.sha1
            LegendaryRais-Geyser-v3.5.2-mappings.json
          retention-days: 7
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LegendaryRais-Bedrock-v3.5.2-REFORGED-HOTFIX.mcpack LegendaryRais-Bedrock-v3.5.2-REFORGED-HOTFIX.sha1 LegendaryRais-Geyser-v3.5.2-mappings.json
          git commit -m "Publish LegendaryRais Bedrock v3.5.2 Reforged Hotfix" || exit 0
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push

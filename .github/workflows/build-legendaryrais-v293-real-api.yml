name: Build LegendaryRais v2.9.3 Real Paper 26.2 API

on:
  push:
    branches: [main]
    paths:
      - ".build/LegendaryRais-2.9.0-REWORK-SOURCE.zip"
      - ".build/trigger-v293-plugin.txt"
      - ".github/workflows/build-legendaryrais-v293-real-api.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Prepare exact Paper 26.2 build 112 source
        run: |
          rm -rf .build/v293-src
          mkdir -p .build/v293-src
          unzip -q .build/LegendaryRais-2.9.0-REWORK-SOURCE.zip -d .build/v293-src
          python3 - <<'PY'
          from pathlib import Path
          p=Path(".build/v293-src/pom.xml")
          s=p.read_text()
          s=s.replace("<version>2.9.0</version>", "<version>2.9.3</version>", 1)
          s=s.replace("<maven.compiler.release>21</maven.compiler.release>", "<maven.compiler.release>25</maven.compiler.release>")
          s=s.replace("<version>1.21.1-R0.1-SNAPSHOT</version>", "<version>26.2.build.112-stable</version>")
          p.write_text(s)
          y=Path(".build/v293-src/src/main/resources/plugin.yml")
          t=y.read_text()
          t=t.replace("version: 2.9.0", "version: 2.9.3")
          t=t.replace("api-version: '1.21'", "api-version: '26.2'")
          y.write_text(t)
          j=Path(".build/v293-src/src/main/java/id/raisnet/legendaryrais/LegendaryRais.java")
          q=j.read_text()
          q=q.replace("LegendaryRais v2.9.0 REWORK enabled.", "LegendaryRais v2.9.3 REAL PAPER 26.2 API enabled.")
          j.write_text(q)
          PY

      - name: Compile against Paper API 26.2 build 112
        id: compile
        shell: bash
        run: |
          set +e
          cd .build/v293-src
          mvn -B -U clean package > ../LegendaryRais-v2.9.3-build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            cp target/legendaryrais-2.9.3.jar ../../LegendaryRais-2.9.3-PAPER-26.2-REAL-API.jar
            sha256sum ../../LegendaryRais-2.9.3-PAPER-26.2-REAL-API.jar > ../../LegendaryRais-2.9.3-PAPER-26.2-REAL-API.sha256
            javap -classpath ../../LegendaryRais-2.9.3-PAPER-26.2-REAL-API.jar -verbose id.raisnet.legendaryrais.LegendaryRais > ../LegendaryRais-v2.9.3-javap.txt 2>&1
          fi
          exit 0

      - name: Publish build result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build/LegendaryRais-v2.9.3-build.log
          if [ -f .build/LegendaryRais-v2.9.3-javap.txt ]; then git add .build/LegendaryRais-v2.9.3-javap.txt; fi
          if [ -f LegendaryRais-2.9.3-PAPER-26.2-REAL-API.jar ]; then
            git add LegendaryRais-2.9.3-PAPER-26.2-REAL-API.jar LegendaryRais-2.9.3-PAPER-26.2-REAL-API.sha256
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build LegendaryRais v2.9.3 against Paper 26.2 build 112"
          git pull --rebase origin main
          git push

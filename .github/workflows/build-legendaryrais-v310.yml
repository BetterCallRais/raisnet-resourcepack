name: Build LegendaryRais v3.1 Realistic Arsenal

on:
  push:
    branches: [main]
    paths:
      - ".build/extracted-v310/**"
      - ".build/trigger-v310-build.txt"
      - ".github/workflows/build-legendaryrais-v310.yml"

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Reconstruct verified v3 base
        run: |
          set -euo pipefail
          rm -rf .build/v310-src .build/v310-source.zip
          cat .build/v300x-00.b64 .build/v300x-01.b64 .build/v300x-02.b64 .build/v300x-03.b64 .build/v300x-04.b64 .build/v300x-05.b64 | tr -d '\n\r ' | base64 -d > .build/v310-source.zip
          unzip -t .build/v310-source.zip
          mkdir -p .build/v310-src
          unzip -q .build/v310-source.zip -d .build/v310-src
          cp .build/extracted-v310/LegendaryRais.java .build/v310-src/src/main/java/id/raisnet/legendaryrais/LegendaryRais.java
          cp .build/extracted-v310/ArsenalExpansion.java .build/v310-src/src/main/java/id/raisnet/legendaryrais/ArsenalExpansion.java
          cp .build/extracted-v310/plugin.yml .build/v310-src/src/main/resources/plugin.yml
          cp .build/extracted-v310/pom.xml .build/v310-src/pom.xml

      - name: Guard premium water relic values
        run: |
          grep -q 'getConfig().set("base-hit.sword", 38.0)' .build/v310-src/src/main/java/id/raisnet/legendaryrais/LegendaryRais.java
          grep -q 'getConfig().set("base-hit.trident", 44.0)' .build/v310-src/src/main/java/id/raisnet/legendaryrais/LegendaryRais.java
          grep -q 'getConfig().set("abyssal-step.damage", 650.0)' .build/v310-src/src/main/java/id/raisnet/legendaryrais/LegendaryRais.java
          grep -q 'getConfig().set("leviathan.ultimate.collapse-damage", 1000.0)' .build/v310-src/src/main/java/id/raisnet/legendaryrais/LegendaryRais.java
          grep -q 'SOUL_TIDE_MODEL_DATA = 910041' .build/v310-src/src/main/java/id/raisnet/legendaryrais/LegendaryRais.java
          grep -q 'LEVIATHAN_MODEL_DATA = 910042' .build/v310-src/src/main/java/id/raisnet/legendaryrais/LegendaryRais.java

      - name: Compile Paper 26.1.2 build 74
        run: |
          cd .build/v310-src
          mvn -B -U clean package
          cp target/legendaryrais-3.1.0.jar ../../LegendaryRais-3.1.0-REALISTIC-ARSENAL-PAPER-26.1.2.jar
          sha256sum ../../LegendaryRais-3.1.0-REALISTIC-ARSENAL-PAPER-26.1.2.jar > ../../LegendaryRais-3.1.0-REALISTIC-ARSENAL-PAPER-26.1.2.sha256

      - name: Verify jar
        run: |
          unzip -t LegendaryRais-3.1.0-REALISTIC-ARSENAL-PAPER-26.1.2.jar
          unzip -p LegendaryRais-3.1.0-REALISTIC-ARSENAL-PAPER-26.1.2.jar plugin.yml | grep -q "version: 3.1.0"
          jar tf LegendaryRais-3.1.0-REALISTIC-ARSENAL-PAPER-26.1.2.jar | grep -q 'ArsenalExpansion.class'

      - name: Smoke boot exact Paper
        run: |
          set -euo pipefail
          UA="RaisNet-LegendaryRais-v310"
          BUILDS=$(curl -fsSL -H "User-Agent: $UA" https://fill.papermc.io/v3/projects/paper/versions/26.1.2/builds)
          URL=$(echo "$BUILDS" | jq -r 'first(.[] | select((.id == 74) or (.number == 74)) | .downloads."server:default".url) // empty')
          test -n "$URL"
          mkdir -p .build/smoke-v310/plugins
          curl -fsSL -H "User-Agent: $UA" "$URL" -o .build/smoke-v310/paper.jar
          cp LegendaryRais-3.1.0-REALISTIC-ARSENAL-PAPER-26.1.2.jar .build/smoke-v310/plugins/
          echo "eula=true" > .build/smoke-v310/eula.txt
          cat > .build/smoke-v310/server.properties <<'EOF'
          online-mode=false
          server-port=25565
          view-distance=2
          simulation-distance=2
          max-players=2
          spawn-protection=0
          enable-query=false
          enable-rcon=false
          require-resource-pack=false
          EOF
          cd .build/smoke-v310
          set +e
          java -Xms512M -Xmx1024M -jar paper.jar nogui > server.log 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 130); do
            if grep -Fq "LegendaryRais v3.1.0 LEGENDARY ARSENAL enabled." server.log; then OK=1; break; fi
            if grep -Fq "Error occurred while enabling LegendaryRais" server.log; then break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          grep -i -C 12 LegendaryRais server.log || true
          test "$OK" -eq 1

      - name: Upload verified plugin
        uses: actions/upload-artifact@v4
        with:
          name: LegendaryRais-3.1.0-REALISTIC-ARSENAL-PAPER-26.1.2
          path: |
            LegendaryRais-3.1.0-REALISTIC-ARSENAL-PAPER-26.1.2.jar
            LegendaryRais-3.1.0-REALISTIC-ARSENAL-PAPER-26.1.2.sha256
          retention-days: 7

      - name: Publish verified plugin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LegendaryRais-3.1.0-REALISTIC-ARSENAL-PAPER-26.1.2.jar LegendaryRais-3.1.0-REALISTIC-ARSENAL-PAPER-26.1.2.sha256
          git commit -m "Publish LegendaryRais v3.1 Realistic Arsenal plugin" || exit 0
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push

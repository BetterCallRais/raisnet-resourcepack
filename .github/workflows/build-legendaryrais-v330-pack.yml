name: Build LegendaryRais v3.3 Final Java Pack
on:
  push:
    branches: [main]
    paths:
      - ".build/build_v330_pack.py"
      - ".build/trigger-v330-pack.txt"
      - ".github/workflows/build-legendaryrais-v330-pack.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Build and validate
        run: python .build/build_v330_pack.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LegendaryRais-Java-26.1.2-v3.3.0-FINAL-REBUILD
          path: |
            LegendaryRais-Java-26.1.2-v3.3.0-FINAL-REBUILD.zip
            LegendaryRais-Java-26.1.2-v3.3.0-FINAL-REBUILD.sha1
          retention-days: 7
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LegendaryRais-Java-26.1.2-v3.3.0-FINAL-REBUILD.zip LegendaryRais-Java-26.1.2-v3.3.0-FINAL-REBUILD.sha1
          git commit -m "Publish LegendaryRais Java v3.3 final rebuild pack" || exit 0
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push

name: Build LegendaryRais v3.0 HD Java Pack
on:
  push:
    branches: [main]
    paths:
      - ".build/build_v300_pack.py"
      - ".build/trigger-v300-pack.txt"
      - ".github/workflows/build-legendaryrais-v300-pack.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate pack
        run: python3 .build/build_v300_pack.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegendaryRais-Java-26.1.2-v3.0.0-LEGENDARY-ARSENAL
          path: |
            LegendaryRais-Java-26.1.2-v3.0.0-LEGENDARY-ARSENAL.zip
            LegendaryRais-Java-26.1.2-v3.0.0-LEGENDARY-ARSENAL.zip.sha1
          retention-days: 7
      - name: Publish to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LegendaryRais-Java-26.1.2-v3.0.0-LEGENDARY-ARSENAL.zip LegendaryRais-Java-26.1.2-v3.0.0-LEGENDARY-ARSENAL.zip.sha1
          git commit -m "Publish LegendaryRais Java v3.0 Legendary Arsenal pack" || exit 0
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push

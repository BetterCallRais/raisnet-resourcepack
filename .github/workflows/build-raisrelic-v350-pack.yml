name: Build RaisRelic v3.5 Ultimate Polish Java Pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.build/raisrelic-v350-pack/**'
      - '.github/scripts/build_raisrelic_v350_pack_github.py'
      - '.github/workflows/build-raisrelic-v350-pack.yml'

permissions:
  contents: write

jobs:
  build-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Reassemble exact v3.5 metadata delta
        shell: bash
        run: |
          set -euo pipefail
          cat .build/raisrelic-v350-pack/nonpng.part* > .build/raisrelic-v350-pack/nonpng_delta.b64
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          p=Path('.build/raisrelic-v350-pack/nonpng_delta.b64')
          data=''.join(p.read_text().split())
          raw=base64.b64decode(data, validate=True)
          gzip.decompress(raw)
          print('Delta base64 chars:', len(data))
          print('Delta gzip bytes:', len(raw))
          PY

      - name: Update builder validator for Minecraft 26.1 metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/build_raisrelic_v350_pack_github.py')
          s=p.read_text()
          old="mc=json.loads((WORK/'pack.mcmeta').read_text()); pf=mc.get('pack',{}).get('pack_format')\n    if pf not in (84,84.0): raise SystemExit(f'Unexpected pack_format {pf}')"
          new="mc=json.loads((WORK/'pack.mcmeta').read_text()); pack=mc.get('pack',{}); pf=pack.get('pack_format'); minf=pack.get('min_format')\n    if pf not in (84,84.0) and not (isinstance(minf,list) and minf and minf[0] == 84): raise SystemExit(f'Unexpected Minecraft 26.1 format: pack_format={pf}, min_format={minf}')"
          if old not in s:
              raise SystemExit('Could not patch pack metadata validator')
          s=s.replace(old,new)
          old2="for ref in collect_texture_refs(WORK):\n        p=WORK/'assets'/'raisnet'/'textures'/'item'/(ref+'.png')\n        if not p.exists(): missing.append(ref)"
          new2="for ref in collect_texture_refs(WORK):\n        if not (ref.startswith('legendary/') or ref.startswith('effects/')): continue\n        p=WORK/'assets'/'raisnet'/'textures'/'item'/(ref+'.png')\n        if not p.exists(): missing.append(ref)"
          if old2 in s:
              s=s.replace(old2,new2)
          old3="with zipfile.ZipFile(OUT,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:"
          new3="with zipfile.ZipFile(OUT,'w',zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=False) as z:"
          if old3 not in s:
              raise SystemExit('Could not patch ZIP timestamp handling')
          s=s.replace(old3,new3)
          p.write_text(s)
          PY

      - name: Build Ultimate Polish pack
        run: python .github/scripts/build_raisrelic_v350_pack_github.py

      - name: Validate Java resource pack
        shell: bash
        run: |
          set -euo pipefail
          P=RaisNet-RaisRelic-UltimatePolish-Java-26.1-v3.5.0.zip
          S=RaisNet-RaisRelic-UltimatePolish-Java-26.1-v3.5.0.sha1
          test -s "$P"
          test -s "$S"
          unzip -t "$P"
          python - <<'PY'
          import json, zipfile
          p='RaisNet-RaisRelic-UltimatePolish-Java-26.1-v3.5.0.zip'
          with zipfile.ZipFile(p) as z:
              meta=json.loads(z.read('pack.mcmeta'))
          pack=meta.get('pack',{})
          pf=pack.get('pack_format')
          mn=pack.get('min_format')
          mx=pack.get('max_format')
          ok=(pf in (84,84.0)) or (isinstance(mn,list) and mn and mn[0]==84 and isinstance(mx,list) and mx and mx[0]==84)
          if not ok: raise SystemExit(f'Wrong format: {pack}')
          print('Minecraft 26.1 pack metadata OK:', pack)
          PY
          CALC=$(sha1sum "$P" | awk '{print $1}')
          FILE=$(tr -d '\r\n ' < "$S")
          test "$CALC" = "$FILE"
          echo "Java pack bytes: $(stat -c%s "$P")"
          echo "Java pack SHA1: $CALC"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaisRelic-v3.5-UltimatePolish-Java-Pack
          path: |
            RaisNet-RaisRelic-UltimatePolish-Java-26.1-v3.5.0.zip
            RaisNet-RaisRelic-UltimatePolish-Java-26.1-v3.5.0.sha1

      - name: Publish pack to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RaisNet Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add RaisNet-RaisRelic-UltimatePolish-Java-26.1-v3.5.0.zip RaisNet-RaisRelic-UltimatePolish-Java-26.1-v3.5.0.sha1
          if ! git diff --cached --quiet; then
            git commit -m 'Publish RaisRelic v3.5 Ultimate Polish Java pack'
            git push
          fi

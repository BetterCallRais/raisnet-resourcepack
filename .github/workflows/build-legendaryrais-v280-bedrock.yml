name: Build LegendaryRais Bedrock Pack v2.8.0 REALISM FX

on:
  push:
    branches: [main]
    paths:
      - ".build/build_v260_bedrock.py"
      - ".build/build_v280_bedrock.py"
      - ".build/trigger-v280-bedrock.txt"
      - ".github/workflows/build-legendaryrais-v280-bedrock.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate Bedrock v2.8 pack
        run: python3 .build/build_v280_bedrock.py
      - name: Publish Bedrock pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LegendaryRais-Bedrock-v2.8.0-REALISM-FX.mcpack LegendaryRais-Bedrock-v2.8.0-REALISM-FX.sha1 LegendaryRais-Geyser-v2.8.0-mappings.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish LegendaryRais v2.8 Bedrock REALISM FX pack"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push

name: Build LegendaryRais Resource Pack v2.4.0 FINAL

on:
  push:
    branches: [main]
    paths:
      - ".build/build_v220.py"
      - ".build/build_v240.py"
      - ".build/trigger-v240.txt"
      - ".github/workflows/build-legendaryrais-v240.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate FINAL resource pack
        run: python3 .build/build_v240.py
      - name: Publish pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LegendaryRais-Java-26plus-v2.4.0-FINAL.zip LegendaryRais-Java-26plus-v2.4.0-FINAL.sha1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish LegendaryRais v2.4.0 FINAL resource pack"
          git pull --rebase origin main
          git push

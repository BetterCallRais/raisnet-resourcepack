name: Build LegendaryRais v3.6.1 Performance Elite

on:
  push:
    branches: [main]
    paths:
      - ".build/extracted-v361/**"
      - ".build/build_v361_packs.py"
      - ".github/workflows/build-legendaryrais-v361.yml"

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pillow

      - name: Reconstruct plugin source
        run: |
          set -euo pipefail
          rm -rf .build/v361-src .build/v361-source.zip
          cat .build/v300x-00.b64 .build/v300x-01.b64 .build/v300x-02.b64 .build/v300x-03.b64 .build/v300x-04.b64 .build/v300x-05.b64 | tr -d '\n\r ' | base64 -d > .build/v361-source.zip
          unzip -t .build/v361-source.zip
          mkdir -p .build/v361-src
          unzip -q .build/v361-source.zip -d .build/v361-src
          cp .build/extracted-v361/LegendaryRais.java .build/v361-src/src/main/java/id/raisnet/legendaryrais/LegendaryRais.java
          cp .build/extracted-v361/ArsenalExpansion.java .build/v361-src/src/main/java/id/raisnet/legendaryrais/ArsenalExpansion.java
          cp .build/extracted-v361/plugin.yml .build/v361-src/src/main/resources/plugin.yml
          cp .build/extracted-v361/pom.xml .build/v361-src/pom.xml

      - name: Guard balance + performance rules
        run: |
          set -euo pipefail
          grep -q 'version >= 361' .build/v361-src/src/main/java/id/raisnet/legendaryrais/LegendaryRais.java
          grep -q 'config-version", 361' .build/v361-src/src/main/java/id/raisnet/legendaryrais/LegendaryRais.java
          grep -q '390.0' .build/v361-src/src/main/java/id/raisnet/legendaryrais/ArsenalExpansion.java
          grep -q 'case TITAN->skill?8.6:4.4' .build/v361-src/src/main/java/id/raisnet/legendaryrais/ArsenalExpansion.java
          grep -q 'armorDoubleSneak' .build/v361-src/src/main/java/id/raisnet/legendaryrais/ArsenalExpansion.java
          grep -q 'armorPunchHit' .build/v361-src/src/main/java/id/raisnet/legendaryrais/ArsenalExpansion.java
          grep -q 'effectivePerf' .build/v361-src/src/main/java/id/raisnet/legendaryrais/ArsenalExpansion.java
          grep -q 'viewer.spawnParticle' .build/v361-src/src/main/java/id/raisnet/legendaryrais/ArsenalExpansion.java
          grep -q 'hideEntity(plugin,d)' .build/v361-src/src/main/java/id/raisnet/legendaryrais/ArsenalExpansion.java
          grep -q 'risperf:' .build/v361-src/src/main/resources/plugin.yml
          grep -q 'SOUL_TIDE_MODEL_DATA = 910041' .build/v361-src/src/main/java/id/raisnet/legendaryrais/LegendaryRais.java
          grep -q 'LEVIATHAN_MODEL_DATA = 910042' .build/v361-src/src/main/java/id/raisnet/legendaryrais/LegendaryRais.java

      - name: Compile plugin
        run: |
          set -euo pipefail
          cd .build/v361-src
          mvn -B -U clean package
          cp target/legendaryrais-3.6.1.jar ../../LegendaryRais-3.6.1-PERFORMANCE-ELITE-PAPER-26.1.2.jar
          sha256sum ../../LegendaryRais-3.6.1-PERFORMANCE-ELITE-PAPER-26.1.2.jar > ../../LegendaryRais-3.6.1-PERFORMANCE-ELITE-PAPER-26.1.2.sha256

      - name: Verify plugin
        run: |
          set -euo pipefail
          unzip -t LegendaryRais-3.6.1-PERFORMANCE-ELITE-PAPER-26.1.2.jar
          unzip -p LegendaryRais-3.6.1-PERFORMANCE-ELITE-PAPER-26.1.2.jar plugin.yml | grep -q "version: 3.6.1"
          unzip -p LegendaryRais-3.6.1-PERFORMANCE-ELITE-PAPER-26.1.2.jar plugin.yml | grep -q "risperf:"
          jar tf LegendaryRais-3.6.1-PERFORMANCE-ELITE-PAPER-26.1.2.jar | grep -q 'ArsenalExpansion.class'

      - name: Build optimized Java + Bedrock packs
        run: python .build/build_v361_packs.py

      - name: Validate visual quality + low-end budgets
        run: |
          set -euo pipefail
          unzip -t LegendaryRais-Java-26.1.2-v3.6.1-PERFORMANCE-ELITE.zip
          unzip -t LegendaryRais-Bedrock-v3.6.1-PERFORMANCE-ELITE.mcpack
          python -m json.tool LegendaryRais-Geyser-v3.6.1-mappings.json >/dev/null
          python - <<'PY'
          import zipfile,json,io
          from PIL import Image
          W=['emberfall_claymore','noctis_longsword','stormpiercer_recurve_bow','gaia_war_spear','astral_twin_daggers']
          with zipfile.ZipFile('LegendaryRais-Java-26.1.2-v3.6.1-PERFORMANCE-ELITE.zip') as z:
              for n in W:
                  d=json.loads(z.read(f'assets/legendaryv34/models/item/{n}.json'))
                  assert 8 <= len(d.get('elements',[])) <= 32,(n,len(d.get('elements',[])))
                  assert d['display']['firstperson_righthand']['scale'][0] <= .80
                  for key in ('metal','grip','accent'):
                      ns,path=d['textures'][key].split(':',1)
                      im=Image.open(io.BytesIO(z.read(f'assets/{ns}/textures/{path}.png')))
                      assert im.size==(256,256),(n,key,im.size)
          with zipfile.ZipFile('LegendaryRais-Bedrock-v3.6.1-PERFORMANCE-ELITE.mcpack') as z:
              names=set(z.namelist())
              for n in W:
                  d=json.loads(z.read(f'models/entity/{n}.geo.json'))
                  cubes=d['minecraft:geometry'][0]['bones'][0].get('cubes',[])
                  assert 4 <= len(cubes) <= 30,(n,len(cubes))
                  im=Image.open(io.BytesIO(z.read(f'textures/items/{n}.png')))
                  assert im.size==(128,128),(n,im.size)
              assert len([x for x in names if x.startswith('attachables/armor_') and x.endswith('.json')])>=20
          print('V361_VISUAL_PERF PASS')
          PY

      - name: Smoke boot Paper 26.1.2 build 74
        run: |
          set -euo pipefail
          UA="RaisNet-LegendaryRais-v361"
          BUILDS=$(curl -fsSL -H "User-Agent: $UA" https://fill.papermc.io/v3/projects/paper/versions/26.1.2/builds)
          URL=$(echo "$BUILDS" | jq -r 'first(.[] | select((.id == 74) or (.number == 74)) | .downloads."server:default".url) // empty')
          test -n "$URL"
          mkdir -p .build/smoke-v361/plugins
          curl -fsSL -H "User-Agent: $UA" "$URL" -o .build/smoke-v361/paper.jar
          cp LegendaryRais-3.6.1-PERFORMANCE-ELITE-PAPER-26.1.2.jar .build/smoke-v361/plugins/
          echo "eula=true" > .build/smoke-v361/eula.txt
          printf 'online-mode=false\nserver-port=25565\nview-distance=2\nsimulation-distance=2\nmax-players=2\n' > .build/smoke-v361/server.properties
          cd .build/smoke-v361
          java -Xms512M -Xmx1024M -jar paper.jar nogui > server.log 2>&1 &
          PID=$!
          OK=0; CHECK=0
          for i in $(seq 1 140); do
            grep -Fq "LegendaryRais v3.6.1" server.log && OK=1
            grep -Fq "[SELF-CHECK] PASS" server.log && CHECK=1
            if [ "$OK" -eq 1 ] && [ "$CHECK" -eq 1 ]; then break; fi
            if grep -Fq "Error occurred while enabling LegendaryRais" server.log; then break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          grep -i -C 14 LegendaryRais server.log || true
          test "$OK" -eq 1
          test "$CHECK" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: LegendaryRais-v3.6.1-PERFORMANCE-ELITE
          path: |
            LegendaryRais-3.6.1-PERFORMANCE-ELITE-PAPER-26.1.2.jar
            LegendaryRais-3.6.1-PERFORMANCE-ELITE-PAPER-26.1.2.sha256
            LegendaryRais-Java-26.1.2-v3.6.1-PERFORMANCE-ELITE.zip
            LegendaryRais-Java-26.1.2-v3.6.1-PERFORMANCE-ELITE.sha1
            LegendaryRais-Bedrock-v3.6.1-PERFORMANCE-ELITE.mcpack
            LegendaryRais-Bedrock-v3.6.1-PERFORMANCE-ELITE.sha1
            LegendaryRais-Geyser-v3.6.1-mappings.json
          retention-days: 7

      - name: Publish verified v3.6.1
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             LegendaryRais-3.6.1-PERFORMANCE-ELITE-PAPER-26.1.2.jar             LegendaryRais-3.6.1-PERFORMANCE-ELITE-PAPER-26.1.2.sha256             LegendaryRais-Java-26.1.2-v3.6.1-PERFORMANCE-ELITE.zip             LegendaryRais-Java-26.1.2-v3.6.1-PERFORMANCE-ELITE.sha1             LegendaryRais-Bedrock-v3.6.1-PERFORMANCE-ELITE.mcpack             LegendaryRais-Bedrock-v3.6.1-PERFORMANCE-ELITE.sha1             LegendaryRais-Geyser-v3.6.1-mappings.json
          git commit -m "Publish LegendaryRais v3.6.1 Performance Elite" || exit 0
          git pull --rebase origin main
          git push

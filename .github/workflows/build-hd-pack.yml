name: Build RaisNet FINAL Resource Pack

on:
  push:
    paths:
      - '.github/workflows/build-hd-pack.yml'
      - 'RaisSocialInteract-Java-26.2.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build final Java 26.2 pack
        shell: bash
        run: |
          set -e
          rm -rf packbuild
          mkdir -p packbuild
          unzip -q RaisSocialInteract-Java-26.2.zip -d packbuild

          # Minecraft Java 26.2 uses resource-pack version 88.0.
          cat > packbuild/pack.mcmeta <<'EOF'
          {
            "pack": {
              "description": "RaisNet Social Icons FINAL - Minecraft Java 26.2",
              "min_format": [88, 0],
              "max_format": [88, 0]
            }
          }
          EOF

          mkdir -p packbuild/assets/raisnet/items
          mkdir -p packbuild/assets/raisnet/models/social
          mkdir -p packbuild/assets/raisnet/textures/item
          mkdir -p packbuild/assets/minecraft/items

          # Keep the original recognizable logos but add a soft glow.
          python <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path

          base = Path('packbuild/assets/raisnet/textures/item')
          for name, color in [('whatsapp',(40,255,105)), ('discord',(100,115,255))]:
              p = base / f'{name}.png'
              src = Image.open(p).convert('RGBA')
              alpha = src.getchannel('A')
              glow_alpha = alpha.filter(ImageFilter.GaussianBlur(5)).point(lambda v: int(v * 0.62))
              glow = Image.new('RGBA', src.size, color + (0,))
              glow.putalpha(glow_alpha)
              out = Image.alpha_composite(glow, src)
              out.save(p, optimize=True)
          PY

          cat > packbuild/assets/raisnet/items/whatsapp.json <<'EOF'
          {
            "model": {
              "type": "minecraft:model",
              "model": "raisnet:social/whatsapp"
            }
          }
          EOF

          cat > packbuild/assets/raisnet/items/discord.json <<'EOF'
          {
            "model": {
              "type": "minecraft:model",
              "model": "raisnet:social/discord"
            }
          }
          EOF

          cat > packbuild/assets/raisnet/models/social/whatsapp.json <<'EOF'
          {
            "textures": {"logo":"raisnet:item/whatsapp"},
            "elements": [
              {
                "from": [0,0,7.5],
                "to": [16,16,8.5],
                "faces": {
                  "north": {"uv":[0,0,16,16],"texture":"#logo"},
                  "south": {"uv":[0,0,16,16],"texture":"#logo"}
                }
              }
            ],
            "display": {
              "fixed": {"rotation":[0,180,0],"translation":[0,0,0],"scale":[1.9,1.9,1.9]},
              "ground": {"rotation":[0,0,0],"translation":[0,3,0],"scale":[1.6,1.6,1.6]},
              "gui": {"rotation":[0,180,0],"translation":[0,0,0],"scale":[1.25,1.25,1.25]}
            }
          }
          EOF

          sed 's#raisnet:item/whatsapp#raisnet:item/discord#g' \
            packbuild/assets/raisnet/models/social/whatsapp.json \
            > packbuild/assets/raisnet/models/social/discord.json

          # Fallback path if plugin uses CustomModelData instead of minecraft:item_model.
          cat > packbuild/assets/minecraft/items/paper.json <<'EOF'
          {
            "model": {
              "type": "minecraft:range_dispatch",
              "property": "minecraft:custom_model_data",
              "index": 0,
              "entries": [
                {
                  "threshold": 91001,
                  "model": {"type":"minecraft:model","model":"raisnet:social/whatsapp"}
                },
                {
                  "threshold": 91002,
                  "model": {"type":"minecraft:model","model":"raisnet:social/discord"}
                }
              ],
              "fallback": {"type":"minecraft:model","model":"minecraft:item/paper"}
            }
          }
          EOF

          python <<'PY'
          import json
          from pathlib import Path
          root = Path('packbuild')
          for p in list(root.rglob('*.json')) + [root / 'pack.mcmeta']:
              json.loads(p.read_text())
              print('validated', p)
          PY

          rm -f RaisSocialInteract-Java-26.2-FINAL.zip RaisSocialInteract-Java-26.2-FINAL.sha1
          (cd packbuild && zip -qr ../RaisSocialInteract-Java-26.2-FINAL.zip .)
          sha1sum RaisSocialInteract-Java-26.2-FINAL.zip | awk '{print $1}' > RaisSocialInteract-Java-26.2-FINAL.sha1
          echo "FINAL SHA1: $(cat RaisSocialInteract-Java-26.2-FINAL.sha1)"

      - name: Commit final pack
        run: |
          git config user.name "RaisNet Pack Bot"
          git config user.email "actions@users.noreply.github.com"
          git add RaisSocialInteract-Java-26.2-FINAL.zip RaisSocialInteract-Java-26.2-FINAL.sha1
          git commit -m "Generate FINAL Java 26.2 social resource pack" || exit 0
          git push

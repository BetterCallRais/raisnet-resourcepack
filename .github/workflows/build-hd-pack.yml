name: Build RaisNet HD Resource Pack

on:
  push:
    paths:
      - 'RaisSocialInteract-Java-26.2-HD.zip.b64'
      - '.github/workflows/build-hd-pack.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode resource pack
        run: |
          base64 -d RaisSocialInteract-Java-26.2-HD.zip.b64 > RaisSocialInteract-Java-26.2-HD.zip
      - name: Commit resource pack
        run: |
          git config user.name "RaisNet Pack Bot"
          git config user.email "actions@users.noreply.github.com"
          git add RaisSocialInteract-Java-26.2-HD.zip
          git commit -m "Build HD Java resource pack" || exit 0
          git push

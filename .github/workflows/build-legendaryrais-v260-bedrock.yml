name: Build LegendaryRais Bedrock Pack v2.6.0 AQUATIC AWAKENING

on:
  push:
    branches: [main]
    paths:
      - ".build/build_v250_bedrock.py"
      - ".build/build_v260_bedrock.py"
      - ".build/trigger-v260-bedrock.txt"
      - ".github/workflows/build-legendaryrais-v260-bedrock.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate Bedrock v2.6 pack
        run: python3 .build/build_v260_bedrock.py
      - name: Publish Bedrock pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LegendaryRais-Bedrock-v2.6.0-AQUATIC-AWAKENING.mcpack LegendaryRais-Bedrock-v2.6.0-AQUATIC-AWAKENING.sha1 LegendaryRais-Geyser-v2.6.0-mappings.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish LegendaryRais v2.6 Bedrock AQUATIC AWAKENING pack"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push

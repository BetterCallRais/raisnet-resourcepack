name: Smoke Test LegendaryRais v2.9.5 Paper 26.1.2 Build74

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/smoke-legendaryrais-v295-paper2612.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Download exact Paper 26.1.2 build 74
        run: |
          set -euo pipefail
          UA="RaisNet-LegendaryRais-SmokeTest/2.9.5"
          BUILDS=$(curl -fsSL -H "User-Agent: $UA" https://fill.papermc.io/v3/projects/paper/versions/26.1.2/builds)
          URL=$(echo "$BUILDS" | jq -r 'first(.[] | select((.id == 74) or (.number == 74)) | .downloads."server:default".url) // empty')
          if [ -z "$URL" ]; then
            echo "Paper 26.1.2 build 74 URL not found"
            echo "$BUILDS" | jq .
            exit 1
          fi
          mkdir -p .build/smoke-v295/plugins
          curl -fsSL -H "User-Agent: $UA" "$URL" -o .build/smoke-v295/paper.jar
          cp LegendaryRais-2.9.5-PAPER-26.1.2-BUILD74.jar .build/smoke-v295/plugins/
          echo "eula=true" > .build/smoke-v295/eula.txt
          cat > .build/smoke-v295/server.properties <<'EOF'
          online-mode=false
          server-port=25565
          view-distance=2
          simulation-distance=2
          max-players=2
          spawn-protection=0
          enable-query=false
          enable-rcon=false
          require-resource-pack=false
          EOF

      - name: Boot Paper and verify plugin enables
        shell: bash
        run: |
          set +e
          cd .build/smoke-v295
          java -Xms512M -Xmx1024M -jar paper.jar nogui > server.log 2>&1 &
          PID=$!
          ENABLED=0
          for i in $(seq 1 120); do
            if grep -Fq "LegendaryRais v2.9.5 PAPER 26.1.2 BUILD74 enabled." server.log; then
              ENABLED=1
              break
            fi
            if grep -Fq "Error occurred while enabling LegendaryRais" server.log; then break; fi
            if grep -Fq "Could not load plugin 'LegendaryRais" server.log; then break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          grep -i -C 8 "LegendaryRais" server.log || true
          if [ "$ENABLED" -ne 1 ]; then
            echo "LegendaryRais did NOT enable"
            tail -n 160 server.log
            exit 1
          fi
          if grep -Fq "Unsupported API version" server.log; then exit 1; fi
          if grep -Fq "Error occurred while enabling LegendaryRais" server.log; then exit 1; fi
          echo "SMOKE_TEST_OK: LegendaryRais v2.9.5 enabled on Paper 26.1.2 build 74 / Java 26"

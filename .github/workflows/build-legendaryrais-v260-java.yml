name: Build LegendaryRais Java Pack v2.6.0 AQUATIC AWAKENING

on:
  push:
    branches: [main]
    paths:
      - ".build/build_v250_java.py"
      - ".build/build_v260_java.py"
      - ".build/trigger-v260-java.txt"
      - ".github/workflows/build-legendaryrais-v260-java.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate Java v2.6 pack
        run: python3 .build/build_v260_java.py
      - name: Publish Java pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LegendaryRais-Java-26plus-v2.6.0-AQUATIC-AWAKENING.zip LegendaryRais-Java-26plus-v2.6.0-AQUATIC-AWAKENING.sha1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish LegendaryRais v2.6 Java AQUATIC AWAKENING pack"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push

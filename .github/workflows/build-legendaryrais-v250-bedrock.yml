name: Build LegendaryRais Bedrock Pack v2.5.0 LIVE AURA

on:
  push:
    branches: [main]
    paths:
      - ".build/build_v250_bedrock.py"
      - ".build/trigger-v250-bedrock.txt"
      - ".github/workflows/build-legendaryrais-v250-bedrock.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate Bedrock pack + Geyser mappings
        run: python3 .build/build_v250_bedrock.py
      - name: Publish Bedrock assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LegendaryRais-Bedrock-v2.5.0-LIVE-AURA.mcpack LegendaryRais-Bedrock-v2.5.0-LIVE-AURA.sha1 LegendaryRais-Geyser-v2.5.0-mappings.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish LegendaryRais v2.5 Bedrock LIVE AURA pack"
          git pull --rebase origin main
          git push

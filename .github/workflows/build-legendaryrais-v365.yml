name: Build LegendaryRais v3.6.5 Weapon Rig Armor Skill

on:
  push:
    branches: [main]
    paths:
      - ".build/extracted-v365/**"
      - ".build/build_v365_packs.py"
      - ".github/workflows/build-legendaryrais-v365.yml"

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pillow

      - name: Reconstruct plugin source
        run: |
          set -euo pipefail
          rm -rf .build/v365-src .build/v365-source.zip
          cat .build/v300x-00.b64 .build/v300x-01.b64 .build/v300x-02.b64 .build/v300x-03.b64 .build/v300x-04.b64 .build/v300x-05.b64 | tr -d '\n\r ' | base64 -d > .build/v365-source.zip
          unzip -t .build/v365-source.zip
          mkdir -p .build/v365-src
          unzip -q .build/v365-source.zip -d .build/v365-src
          cp .build/extracted-v365/LegendaryRais.java .build/v365-src/src/main/java/id/raisnet/legendaryrais/LegendaryRais.java
          cp .build/extracted-v365/ArsenalExpansion.java .build/v365-src/src/main/java/id/raisnet/legendaryrais/ArsenalExpansion.java
          cp .build/extracted-v365/plugin.yml .build/v365-src/src/main/resources/plugin.yml
          cp .build/extracted-v365/pom.xml .build/v365-src/pom.xml

      - name: Guard v3.6.5 gameplay and input fixes
        run: |
          set -euo pipefail
          SRC=.build/v365-src/src/main/java/id/raisnet/legendaryrais
          grep -q 'version >= 365' "$SRC/LegendaryRais.java"
          grep -q 'config-version", 365' "$SRC/LegendaryRais.java"
          grep -q 'double-sneak-window-ms",1000L' "$SRC/LegendaryRais.java"
          grep -q 'punch-arm-ms",6000L' "$SRC/LegendaryRais.java"
          grep -q 'tryArmorUtility' "$SRC/ArsenalExpansion.java"
          grep -q 'armorUtilityEntityRightClick' "$SRC/ArsenalExpansion.java"
          grep -q 'armorUtilityAtEntityRightClick' "$SRC/ArsenalExpansion.java"
          grep -q 'Math.max(configured,isBedrock(p)?1400L:950L)' "$SRC/ArsenalExpansion.java"
          grep -q 'PersistentDataType.INTEGER,365' "$SRC/ArsenalExpansion.java"
          grep -q 'normal right-click is NEVER cancelled' "$SRC/ArsenalExpansion.java"
          grep -q 'SOUL_TIDE_MODEL_DATA = 910041' "$SRC/LegendaryRais.java"
          grep -q 'LEVIATHAN_MODEL_DATA = 910042' "$SRC/LegendaryRais.java"

      - name: Compile plugin
        run: |
          set -euo pipefail
          cd .build/v365-src
          mvn -B -U clean package
          cp target/legendaryrais-3.6.5.jar ../../LegendaryRais-3.6.5-WEAPON-RIG-ARMOR-SKILL-PAPER-26.1.2.jar
          sha256sum ../../LegendaryRais-3.6.5-WEAPON-RIG-ARMOR-SKILL-PAPER-26.1.2.jar > ../../LegendaryRais-3.6.5-WEAPON-RIG-ARMOR-SKILL-PAPER-26.1.2.sha256

      - name: Verify plugin
        run: |
          set -euo pipefail
          unzip -t LegendaryRais-3.6.5-WEAPON-RIG-ARMOR-SKILL-PAPER-26.1.2.jar
          unzip -p LegendaryRais-3.6.5-WEAPON-RIG-ARMOR-SKILL-PAPER-26.1.2.jar plugin.yml | grep -q "version: 3.6.5"
          jar tf LegendaryRais-3.6.5-WEAPON-RIG-ARMOR-SKILL-PAPER-26.1.2.jar | grep -q 'ArsenalExpansion.class'

      - name: Build and audit Java + Bedrock packs
        run: python .build/build_v365_packs.py

      - name: Validate centered grips and Bedrock hold animations
        run: |
          set -euo pipefail
          unzip -t LegendaryRais-Java-26.1.2-v3.6.5-WEAPON-RIG-ARMOR-SKILL.zip
          unzip -t LegendaryRais-Bedrock-v3.6.5-WEAPON-RIG-ARMOR-SKILL.mcpack
          python -m json.tool LegendaryRais-Geyser-v3.6.5-mappings.json >/dev/null
          python - <<'PY'
          import zipfile,json
          W=('emberfall_claymore','noctis_longsword','stormpiercer_recurve_bow','gaia_war_spear','astral_frost_greataxe')
          with zipfile.ZipFile('LegendaryRais-Java-26.1.2-v3.6.5-WEAPON-RIG-ARMOR-SKILL.zip') as z:
              for n in W:
                  d=json.loads(z.read(f'assets/legendaryv34/models/item/{n}.json'))
                  zs=[v for e in d['elements'] for v in (e['from'][2],e['to'][2])]
                  assert 7.0 <= sum(zs)/len(zs) <= 9.0,(n,sum(zs)/len(zs))
                  tp=d['display']['thirdperson_righthand']
                  assert abs(tp['translation'][0]) <= .05,(n,tp)
                  assert abs(tp['translation'][2]) <= .15,(n,tp)
          with zipfile.ZipFile('LegendaryRais-Bedrock-v3.6.5-WEAPON-RIG-ARMOR-SKILL.mcpack') as z:
              anim=json.loads(z.read('animations/legendary_weapons_v365.animation.json'))['animations']
              for n in W:
                  a=json.loads(z.read(f'attachables/{n}.player.json'))['minecraft:attachable']['description']
                  assert set(a['animations'])=={'hold_first_person','hold_third_person'}
                  assert len(a['scripts']['animate'])==2
                  assert anim[a['animations']['hold_third_person']]['bones']['bb_main']['position'][1]==-24
          print('V365_RIG_VALIDATION PASS')
          PY

      - name: Smoke boot Paper 26.1.2 build 74
        run: |
          set -euo pipefail
          UA="RaisNet-LegendaryRais-v365"
          BUILDS=$(curl -fsSL -H "User-Agent: $UA" https://fill.papermc.io/v3/projects/paper/versions/26.1.2/builds)
          URL=$(echo "$BUILDS" | jq -r 'first(.[] | select((.id == 74) or (.number == 74)) | .downloads."server:default".url) // empty')
          test -n "$URL"
          mkdir -p .build/smoke-v365/plugins
          curl -fsSL -H "User-Agent: $UA" "$URL" -o .build/smoke-v365/paper.jar
          cp LegendaryRais-3.6.5-WEAPON-RIG-ARMOR-SKILL-PAPER-26.1.2.jar .build/smoke-v365/plugins/
          echo "eula=true" > .build/smoke-v365/eula.txt
          printf 'online-mode=false\nserver-port=25565\nview-distance=2\nsimulation-distance=2\nmax-players=2\n' > .build/smoke-v365/server.properties
          cd .build/smoke-v365
          java -Xms512M -Xmx1024M -jar paper.jar nogui > server.log 2>&1 &
          PID=$!
          OK=0; CHECK=0
          for i in $(seq 1 140); do
            grep -Fq "LegendaryRais v3.6.5" server.log && OK=1
            grep -Fq "[SELF-CHECK] PASS" server.log && CHECK=1
            if [ "$OK" -eq 1 ] && [ "$CHECK" -eq 1 ]; then break; fi
            if grep -Fq "Error occurred while enabling LegendaryRais" server.log; then break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          grep -i -C 14 LegendaryRais server.log || true
          test "$OK" -eq 1
          test "$CHECK" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: LegendaryRais-v3.6.5-WEAPON-RIG-ARMOR-SKILL
          path: |
            LegendaryRais-3.6.5-WEAPON-RIG-ARMOR-SKILL-PAPER-26.1.2.jar
            LegendaryRais-3.6.5-WEAPON-RIG-ARMOR-SKILL-PAPER-26.1.2.sha256
            LegendaryRais-Java-26.1.2-v3.6.5-WEAPON-RIG-ARMOR-SKILL.zip
            LegendaryRais-Java-26.1.2-v3.6.5-WEAPON-RIG-ARMOR-SKILL.sha1
            LegendaryRais-Bedrock-v3.6.5-WEAPON-RIG-ARMOR-SKILL.mcpack
            LegendaryRais-Bedrock-v3.6.5-WEAPON-RIG-ARMOR-SKILL.sha1
            LegendaryRais-Geyser-v3.6.5-mappings.json
          retention-days: 7

      - name: Publish verified v3.6.5
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             LegendaryRais-3.6.5-WEAPON-RIG-ARMOR-SKILL-PAPER-26.1.2.jar             LegendaryRais-3.6.5-WEAPON-RIG-ARMOR-SKILL-PAPER-26.1.2.sha256             LegendaryRais-Java-26.1.2-v3.6.5-WEAPON-RIG-ARMOR-SKILL.zip             LegendaryRais-Java-26.1.2-v3.6.5-WEAPON-RIG-ARMOR-SKILL.sha1             LegendaryRais-Bedrock-v3.6.5-WEAPON-RIG-ARMOR-SKILL.mcpack             LegendaryRais-Bedrock-v3.6.5-WEAPON-RIG-ARMOR-SKILL.sha1             LegendaryRais-Geyser-v3.6.5-mappings.json
          git commit -m "Publish LegendaryRais v3.6.5 Weapon Rig Armor Skill" || exit 0
          git pull --rebase origin main
          git push

name: Build LegendaryRais Java Pack v2.8.0 REALISM FX

on:
  push:
    branches: [main]
    paths:
      - ".build/build_v270_java.py"
      - ".build/build_v280_java.py"
      - ".build/trigger-v280-java.txt"
      - ".github/workflows/build-legendaryrais-v280-java.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate Java v2.8 pack
        run: python3 .build/build_v280_java.py
      - name: Publish Java pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LegendaryRais-Java-26plus-v2.8.0-REALISM-FX.zip LegendaryRais-Java-26plus-v2.8.0-REALISM-FX.sha1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish LegendaryRais v2.8 Java REALISM FX pack"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push

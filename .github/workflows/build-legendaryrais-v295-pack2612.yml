name: Build LegendaryRais Java Pack v2.9.5 MC26.1.2

on:
  push:
    branches: [main]
    paths:
      - ".build/build_v295_java_2612.py"
      - ".build/trigger-v295-pack.txt"
      - ".github/workflows/build-legendaryrais-v295-pack2612.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and validate Java 26.1.2 pack
        run: python3 .build/build_v295_java_2612.py

      - name: Upload pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegendaryRais-Java-26.1.2-v2.9.5-FIX
          path: |
            LegendaryRais-Java-26.1.2-v2.9.5-FIX.zip
            LegendaryRais-Java-26.1.2-v2.9.5-FIX.sha1
          retention-days: 7

      - name: Publish pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LegendaryRais-Java-26.1.2-v2.9.5-FIX.zip LegendaryRais-Java-26.1.2-v2.9.5-FIX.sha1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish LegendaryRais Java v2.9.5 for Minecraft 26.1.2"
          git pull --rebase origin main
          git push

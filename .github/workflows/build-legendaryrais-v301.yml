name: Build LegendaryRais v3.0.1 Water Guard Final

on:
  push:
    branches: [main]
    paths:
      - ".build/trigger-v301.txt"
      - ".github/workflows/build-legendaryrais-v301.yml"

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Reconstruct v3.0 source
        run: |
          set -euo pipefail
          rm -rf .build/v301-src .build/v301-source.zip
          cat .build/v300x-00.b64 .build/v300x-01.b64 .build/v300x-02.b64 .build/v300x-03.b64 .build/v300x-04.b64 .build/v300x-05.b64 | tr -d '\n\r ' | base64 -d > .build/v301-source.zip
          unzip -t .build/v301-source.zip
          mkdir -p .build/v301-src
          unzip -q .build/v301-source.zip -d .build/v301-src

      - name: Patch exact-heart Water Sovereign guard and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.build/v301-src')
          p=root/'src/main/java/id/raisnet/legendaryrais/ArsenalExpansion.java'
          s=p.read_text(encoding='utf-8')
          old='''        double raw=e.getDamage();
                  double cap=raw>=55.0?10.0:5.0;
                  e.setDamage(Math.min(raw,cap));
                  particle(target.getWorld(),"SPLASH",target.getLocation().clone().add(0,1,0),26,.55,.75,.55,.08);
                  pulse(target.getWorld(),target.getLocation().clone().add(0,1,0),"fx_water_sovereign_guard",FX_WATER_ARMOR,1.8f,7,target.getLocation().getYaw(),0);
                  bar(target,"ABYSSAL BULWARK • damage Legendary dibatasi ke "+(cap/2.0)+" hearts");'''
          new='''        double raw=e.getDamage();
                  double cap=raw>=55.0?10.0:5.0;
                  e.setDamage(cap);
                  try {
                      for (EntityDamageEvent.DamageModifier mod : EntityDamageEvent.DamageModifier.values()) {
                          if (mod != EntityDamageEvent.DamageModifier.BASE && e.isApplicable(mod)) e.setDamage(mod, 0.0);
                      }
                  } catch (Throwable ignored) {}
                  particle(target.getWorld(),"SPLASH",target.getLocation().clone().add(0,1,0),26,.55,.75,.55,.08);
                  pulse(target.getWorld(),target.getLocation().clone().add(0,1,0),"fx_water_sovereign_guard",FX_WATER_ARMOR,1.8f,7,target.getLocation().getYaw(),0);
                  bar(target,"ABYSSAL BULWARK • Legendary hit = "+(cap/2.0)+" hearts");'''
          if old not in s:
              raise SystemExit('Water guard patch target missing')
          p.write_text(s.replace(old,new),encoding='utf-8')

          pom=root/'pom.xml'
          x=pom.read_text(encoding='utf-8').replace('<version>3.0.0</version>','<version>3.0.1</version>',1)
          pom.write_text(x,encoding='utf-8')

          y=root/'src/main/resources/plugin.yml'
          t=y.read_text(encoding='utf-8').replace('version: 3.0.0','version: 3.0.1')
          y.write_text(t,encoding='utf-8')

          j=root/'src/main/java/id/raisnet/legendaryrais/LegendaryRais.java'
          q=j.read_text(encoding='utf-8').replace('LegendaryRais v3.0.0 LEGENDARY ARSENAL enabled.','LegendaryRais v3.0.1 LEGENDARY ARSENAL enabled.')
          j.write_text(q,encoding='utf-8')
          PY

      - name: Compile exact Paper API
        run: |
          cd .build/v301-src
          mvn -B -U clean package
          cp target/legendaryrais-3.0.1.jar ../../LegendaryRais-3.0.1-LEGENDARY-ARSENAL-PAPER-26.1.2.jar
          sha256sum ../../LegendaryRais-3.0.1-LEGENDARY-ARSENAL-PAPER-26.1.2.jar > ../../LegendaryRais-3.0.1-LEGENDARY-ARSENAL-PAPER-26.1.2.sha256

      - name: Verify jar
        run: |
          unzip -t LegendaryRais-3.0.1-LEGENDARY-ARSENAL-PAPER-26.1.2.jar
          jar tf LegendaryRais-3.0.1-LEGENDARY-ARSENAL-PAPER-26.1.2.jar | grep -q "id/raisnet/legendaryrais/ArsenalExpansion.class"
          unzip -p LegendaryRais-3.0.1-LEGENDARY-ARSENAL-PAPER-26.1.2.jar plugin.yml | grep -q "version: 3.0.1"

      - name: Smoke boot exact Paper 26.1.2 build 74
        run: |
          set -euo pipefail
          UA="RaisNet-LegendaryRais-v301"
          BUILDS=$(curl -fsSL -H "User-Agent: $UA" https://fill.papermc.io/v3/projects/paper/versions/26.1.2/builds)
          URL=$(echo "$BUILDS" | jq -r 'first(.[] | select((.id == 74) or (.number == 74)) | .downloads."server:default".url) // empty')
          test -n "$URL"
          mkdir -p .build/smoke-v301/plugins
          curl -fsSL -H "User-Agent: $UA" "$URL" -o .build/smoke-v301/paper.jar
          cp LegendaryRais-3.0.1-LEGENDARY-ARSENAL-PAPER-26.1.2.jar .build/smoke-v301/plugins/
          echo "eula=true" > .build/smoke-v301/eula.txt
          cat > .build/smoke-v301/server.properties <<'EOF'
          online-mode=false
          server-port=25565
          view-distance=2
          simulation-distance=2
          max-players=2
          spawn-protection=0
          enable-query=false
          enable-rcon=false
          require-resource-pack=false
          EOF
          cd .build/smoke-v301
          set +e
          java -Xms512M -Xmx1024M -jar paper.jar nogui > server.log 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 130); do
            if grep -Fq "LegendaryRais v3.0.1 LEGENDARY ARSENAL enabled." server.log; then OK=1; break; fi
            if grep -Fq "Error occurred while enabling LegendaryRais" server.log; then break; fi
            if grep -Fq "Could not load plugin 'LegendaryRais" server.log; then break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          grep -i -C 10 "LegendaryRais" server.log || true
          test "$OK" -eq 1

      - name: Upload verified final plugin
        uses: actions/upload-artifact@v4
        with:
          name: LegendaryRais-3.0.1-LEGENDARY-ARSENAL-PAPER-26.1.2
          path: |
            LegendaryRais-3.0.1-LEGENDARY-ARSENAL-PAPER-26.1.2.jar
            LegendaryRais-3.0.1-LEGENDARY-ARSENAL-PAPER-26.1.2.sha256
          retention-days: 7

      - name: Publish final plugin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LegendaryRais-3.0.1-LEGENDARY-ARSENAL-PAPER-26.1.2.jar LegendaryRais-3.0.1-LEGENDARY-ARSENAL-PAPER-26.1.2.sha256
          git commit -m "Publish LegendaryRais v3.0.1 Water Guard final plugin" || exit 0
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push

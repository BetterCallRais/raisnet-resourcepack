name: Build LegendaryRais v3.3 Final Rebuild
on:
  push:
    branches: [main]
    paths:
      - ".build/extracted-v330/**"
      - ".build/trigger-v330-build.txt"
      - ".github/workflows/build-legendaryrais-v330.yml"
permissions:
  contents: write
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
      - name: Reconstruct base and apply v3.3
        run: |
          set -euo pipefail
          rm -rf .build/v330-src .build/v330-source.zip
          cat .build/v300x-00.b64 .build/v300x-01.b64 .build/v300x-02.b64 .build/v300x-03.b64 .build/v300x-04.b64 .build/v300x-05.b64 | tr -d '\n\r ' | base64 -d > .build/v330-source.zip
          unzip -t .build/v330-source.zip
          mkdir -p .build/v330-src
          unzip -q .build/v330-source.zip -d .build/v330-src
          cp .build/extracted-v330/LegendaryRais.java .build/v330-src/src/main/java/id/raisnet/legendaryrais/LegendaryRais.java
          cp .build/extracted-v330/ArsenalExpansion.java .build/v330-src/src/main/java/id/raisnet/legendaryrais/ArsenalExpansion.java
          cp .build/extracted-v330/plugin.yml .build/v330-src/src/main/resources/plugin.yml
          cp .build/extracted-v330/pom.xml .build/v330-src/pom.xml
      - name: Guard Water Relics
        run: |
          grep -q 'getConfig().set("base-hit.sword", 38.0)' .build/v330-src/src/main/java/id/raisnet/legendaryrais/LegendaryRais.java
          grep -q 'getConfig().set("base-hit.trident", 44.0)' .build/v330-src/src/main/java/id/raisnet/legendaryrais/LegendaryRais.java
          grep -q 'getConfig().set("abyssal-step.damage", 650.0)' .build/v330-src/src/main/java/id/raisnet/legendaryrais/LegendaryRais.java
          grep -q 'getConfig().set("leviathan.ultimate.collapse-damage", 1000.0)' .build/v330-src/src/main/java/id/raisnet/legendaryrais/LegendaryRais.java
      - name: Compile
        run: |
          cd .build/v330-src
          mvn -B -U clean package
          cp target/legendaryrais-3.3.0.jar ../../LegendaryRais-3.3.0-FINAL-REBUILD-PAPER-26.1.2.jar
          sha256sum ../../LegendaryRais-3.3.0-FINAL-REBUILD-PAPER-26.1.2.jar > ../../LegendaryRais-3.3.0-FINAL-REBUILD-PAPER-26.1.2.sha256
      - name: Verify
        run: |
          unzip -t LegendaryRais-3.3.0-FINAL-REBUILD-PAPER-26.1.2.jar
          unzip -p LegendaryRais-3.3.0-FINAL-REBUILD-PAPER-26.1.2.jar plugin.yml | grep -q "version: 3.3.0"
          jar tf LegendaryRais-3.3.0-FINAL-REBUILD-PAPER-26.1.2.jar | grep -q 'ArsenalExpansion.class'
      - name: Smoke boot exact Paper 26.1.2 build 74
        run: |
          set -euo pipefail
          UA="RaisNet-LegendaryRais-v330"
          BUILDS=$(curl -fsSL -H "User-Agent: $UA" https://fill.papermc.io/v3/projects/paper/versions/26.1.2/builds)
          URL=$(echo "$BUILDS" | jq -r 'first(.[] | select((.id == 74) or (.number == 74)) | .downloads."server:default".url) // empty')
          test -n "$URL"
          mkdir -p .build/smoke-v330/plugins
          curl -fsSL -H "User-Agent: $UA" "$URL" -o .build/smoke-v330/paper.jar
          cp LegendaryRais-3.3.0-FINAL-REBUILD-PAPER-26.1.2.jar .build/smoke-v330/plugins/
          echo "eula=true" > .build/smoke-v330/eula.txt
          cat > .build/smoke-v330/server.properties <<'EOF'
          online-mode=false
          server-port=25565
          view-distance=2
          simulation-distance=2
          max-players=2
          spawn-protection=0
          enable-query=false
          enable-rcon=false
          require-resource-pack=false
          EOF
          cd .build/smoke-v330
          set +e
          java -Xms512M -Xmx1024M -jar paper.jar nogui > server.log 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 130); do
            if grep -Fq "LegendaryRais v3.3.0" server.log && grep -Fq "enabled" server.log; then OK=1; break; fi
            if grep -Fq "Error occurred while enabling LegendaryRais" server.log; then break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          grep -i -C 12 LegendaryRais server.log || true
          test "$OK" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: LegendaryRais-3.3.0-FINAL-REBUILD-PAPER-26.1.2
          path: |
            LegendaryRais-3.3.0-FINAL-REBUILD-PAPER-26.1.2.jar
            LegendaryRais-3.3.0-FINAL-REBUILD-PAPER-26.1.2.sha256
          retention-days: 7
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LegendaryRais-3.3.0-FINAL-REBUILD-PAPER-26.1.2.jar LegendaryRais-3.3.0-FINAL-REBUILD-PAPER-26.1.2.sha256
          git commit -m "Publish LegendaryRais v3.3 final rebuild plugin" || exit 0
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push
